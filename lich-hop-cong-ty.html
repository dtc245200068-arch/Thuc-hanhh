<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table border="1">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp kế hoạch tuần</td>
        </tr>

        <tr>
            <td>10:00 - 11:00</td>
            <td>Họp phòng kỹ thuật</td>
        </tr>

        <tr>
            <td rowspan="2">Thứ Ba</td>
            <td>08:00 - 09:00</td>
            <td>Họp với khách hàng</td>
        </tr>

        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp đánh giá dự án</td>
        </tr>

        <tr>
            <td>Thứ Tư</td>
            <td colspan="2">08:00 - 11:00: Họp tổng kết công ty</td>
        </tr>
    </table>

</body>
</html>
